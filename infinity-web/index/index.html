<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Developer Profile</title>
  <meta name="description" content="Dynamic developer profile page loaded from JSON." />
  <style>
    :root {
      --bg: #07111f;
      --bg-2: #0c1728;
      --card: rgba(11, 22, 39, 0.72);
      --line: rgba(255, 255, 255, 0.09);
      --text: #eaf1ff;
      --muted: #a9b8d0;
      --soft: #d5def0;
      --accent: #c9a227;
      --good: #65d6a7;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      --radius: 24px;
      --max: 1180px;
    }* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:
    radial-gradient(circle at top left, rgba(201, 162, 39, 0.14), transparent 28%),
    radial-gradient(circle at top right, rgba(143, 211, 255, 0.12), transparent 26%),
    linear-gradient(180deg, #050b14 0%, var(--bg) 30%, #09111d 100%);
  color: var(--text);
  line-height: 1.6;
}

a { color: inherit; text-decoration: none; }

.wrap { width: min(calc(100% - 32px), var(--max)); margin: 0 auto; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(16px);
  background: rgba(4, 10, 19, 0.72);
  border-bottom: 1px solid var(--line);
}

.topbar .inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 0;
}

.brand { display: flex; align-items: center; gap: 12px; font-weight: 700; }
.mark {
  width: 42px; height: 42px; border-radius: 14px;
  display: grid; place-items: center;
  background: linear-gradient(135deg, rgba(201, 162, 39, 0.95), rgba(143, 211, 255, 0.9));
  color: #07111f; font-weight: 900;
}

nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
nav a {
  font-size: 0.92rem; color: var(--muted);
  padding: 8px 12px; border: 1px solid transparent; border-radius: 999px;
}
nav a:hover { color: var(--text); border-color: var(--line); background: rgba(255,255,255,0.03); }

.hero { padding: 46px 0 24px; }
.hero-grid { display: grid; grid-template-columns: 1.4fr 0.9fr; gap: 22px; align-items: stretch; }

.panel, .card, .quote-card, .signal-card, .footer-cta {
  border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(18, 32, 55, 0.84), rgba(7, 16, 29, 0.88));
  box-shadow: var(--shadow);
  border-radius: var(--radius);
  overflow: hidden;
}

.hero-main { padding: 34px; position: relative; overflow: hidden; }
.hero-main::before {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 15% 15%, rgba(201, 162, 39, 0.17), transparent 24%),
    radial-gradient(circle at 82% 12%, rgba(143, 211, 255, 0.16), transparent 18%),
    linear-gradient(135deg, rgba(255,255,255,0.04), transparent 35%);
  pointer-events: none;
}

.eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  color: #d8e4f9; font-size: 0.92rem; padding: 8px 14px;
  border-radius: 999px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04);
  margin-bottom: 18px; position: relative; z-index: 1;
}
.eyebrow .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--good); box-shadow: 0 0 0 6px rgba(101, 214, 167, 0.13); }

h1 { font-size: clamp(2.2rem, 6vw, 4.6rem); line-height: 0.98; margin: 0 0 14px; letter-spacing: -0.04em; position: relative; z-index: 1; }
.subtitle { max-width: 64ch; color: var(--soft); font-size: 1.06rem; margin: 0 0 22px; position: relative; z-index: 1; }

.meta-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; position: relative; z-index: 1; margin-bottom: 22px; }
.meta { padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); }
.meta .label { display: block; color: var(--muted); font-size: 0.82rem; margin-bottom: 6px; }
.meta .value { font-weight: 600; word-break: break-word; }

.cta-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; position: relative; z-index: 1; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  padding: 13px 18px; border-radius: 999px; font-weight: 700; border: 1px solid transparent;
  transition: 0.2s ease;
}
.btn-primary { background: linear-gradient(135deg, #d2b45c, #b78c16); color: #08111c; }
.btn-secondary { background: rgba(255,255,255,0.04); color: var(--text); border-color: rgba(255,255,255,0.08); }
.btn:hover { transform: translateY(-1px); }

.hero-aside { display: grid; gap: 16px; }
.quote-card, .signal-card { padding: 24px; }
.quote { font-size: 1.02rem; color: var(--soft); margin: 0; }
.quote strong { color: var(--accent); }

.signal-list { display: grid; gap: 12px; margin-top: 14px; }
.signal {
  padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07);
  display: flex; justify-content: space-between; gap: 16px;
}
.signal span:first-child { color: var(--muted); font-size: 0.9rem; }
.signal span:last-child { font-weight: 600; text-align: right; }

section { padding: 18px 0; }
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 14px; }
.section-head h2 { font-size: 1.5rem; margin: 0; letter-spacing: -0.02em; }
.section-head p { margin: 0; color: var(--muted); max-width: 70ch; }

.grid-3, .grid-2 { display: grid; gap: 16px; }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.card { padding: 22px; background: var(--card); }
.card h3 { margin: 0 0 10px; font-size: 1.03rem; }
.card p { margin: 0; color: var(--soft); }

.chips, .tag-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.chip, .tag {
  padding: 9px 12px; border-radius: 999px; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08); color: #eaf1ff; font-size: 0.92rem;
}
.tag { font-size: 0.84rem; padding: 6px 10px; }

.stat { display: flex; flex-direction: column; gap: 6px; }
.stat strong { font-size: 1.7rem; letter-spacing: -0.04em; color: #fff; }

.timeline { display: grid; gap: 14px; }
.timeline-item { padding: 20px; border-radius: 20px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); }
.timeline-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.timeline-top strong { font-size: 1.03rem; }
.timeline-top span { color: var(--muted); }

.footer-cta {
  margin: 24px 0 56px; padding: 28px;
  background: linear-gradient(135deg, rgba(201, 162, 39, 0.16), rgba(143, 211, 255, 0.1)), linear-gradient(180deg, rgba(15, 30, 52, 0.96), rgba(7, 15, 26, 0.96));
  text-align: center;
}
.footer-cta h2 { margin: 0 0 10px; font-size: clamp(1.5rem, 3vw, 2.3rem); letter-spacing: -0.03em; }
.footer-cta p { margin: 0 auto 18px; max-width: 70ch; color: var(--soft); }

.small { color: var(--muted); font-size: 0.92rem; }
.muted { color: var(--muted); }
.loading, .error {
  padding: 18px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,255,255,0.04);
  color: var(--soft);
}

@media (max-width: 920px) {
  .hero-grid, .grid-3, .grid-2 { grid-template-columns: 1fr; }
  .meta-grid { grid-template-columns: 1fr; }
  .section-head { align-items: start; flex-direction: column; }
  nav { justify-content: flex-start; }
}

@media (max-width: 640px) {
  .hero-main, .quote-card, .signal-card, .card, .footer-cta { padding: 18px; }
  .topbar .inner { flex-direction: column; align-items: flex-start; }
  h1 { font-size: 2.25rem; }
}

  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap inner">
      <div class="brand">
        <div class="mark">MW</div>
        <div>
          <div id="brandName">Developer Profile</div>
          <div class="small" id="brandRole">Loading profile...</div>
        </div>
      </div>
      <nav aria-label="Primary">
        <a href="#profile">Profile</a>
        <a href="#skills">Skills</a>
        <a href="#experience">Experience</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>  <main class="wrap">
    <section class="hero">
      <div class="hero-grid">
        <article class="panel hero-main" id="profile">
          <div id="heroState" class="loading">Loading developer data…</div>
        </article><aside class="hero-aside">
      <div class="quote-card">
        <p class="quote"><strong>Decision-friendly design.</strong> The layout is structured to sell capability, trust, and readiness at a glance.</p>
        <div class="tag-row">
          <span class="tag">Premium UI</span>
          <span class="tag">Clean structure</span>
          <span class="tag">Trust signals</span>
        </div>
      </div>

      <div class="signal-card">
        <h3 style="margin:0 0 10px;">Quick View</h3>
        <div class="signal-list" id="quickView"></div>
      </div>
    </aside>
  </div>
</section>

<div id="contentState"></div>

  </main>  <script>
    const params = new URLSearchParams(window.location.search);
    const nameFromQuery = params.get('name');
    const nameFromPath = window.location.pathname.split('/').filter(Boolean).pop();
    const developerName = decodeURIComponent(nameFromQuery || nameFromPath || 'muhammad-waseem');

    const dataUrl = `../config/developer/${encodeURIComponent(developerName)}/index.json`;

    const heroState = document.getElementById('heroState');
    const contentState = document.getElementById('contentState');
    const quickView = document.getElementById('quickView');
    const brandName = document.getElementById('brandName');
    const brandRole = document.getElementById('brandRole');

    const escapeHtml = (value) => String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');

    const joinList = (items) => Array.isArray(items) ? items.filter(Boolean).join(', ') : '';

    const renderChips = (items) => (Array.isArray(items) ? items : []).map(item => `<span class="chip">${escapeHtml(item)}</span>`).join('');
    const renderTags = (items) => (Array.isArray(items) ? items : []).map(item => `<span class="tag">${escapeHtml(item)}</span>`).join('');

    async function loadProfile() {
      try {
        const res = await fetch(dataUrl, { cache: 'no-store' });
        if (!res.ok) throw new Error(`Unable to load ${dataUrl} (${res.status})`);
        const json = await res.json();
        const profile = json.applicant_profile || json;

        const personal = profile.personal_information || {};
        const skills = profile.technical_skills_competencies || {};
        const experience = profile.experience_portfolio || {};
        const problem = profile.problem_solving_analytical_skills || {};
        const soft = profile.soft_skills_interpersonal_qualities || {};

        const fullName = personal.full_name || 'Developer';
        const desiredRole = personal.desired_role || 'Developer';
        const preferredLocation = personal.preferred_location || '';
        const startDate = personal.earliest_start_date || '';
        const authorization = personal.work_authorization_status || '';
        const email = personal.email || '';
        const phone = personal.phone_number || '';
        const linkedin = personal.linkedin_profile_url || '';
        const github = personal.github_profile_url || '';
        const portfolio = personal.portfolio_url || '';
        const salary = personal.desired_salary_range_usd || '';
        const references = personal.references_available_upon_request ? 'Yes' : 'On request';
        const years = experience.total_years_experience ?? '';

        document.title = `${fullName} | ${desiredRole}`;
        brandName.textContent = fullName;
        brandRole.textContent = desiredRole;

        heroState.outerHTML = `
          <div class="eyebrow"><span class="dot"></span> Ready for high-trust remote delivery</div>
          <h1>${escapeHtml(fullName)}</h1>
          <p class="subtitle">
            ${escapeHtml(profile.summary || `A focused ${desiredRole} building clean, responsive, high-conversion digital experiences.`)}
          </p>
          <div class="meta-grid">
            <div class="meta"><span class="label">Desired Role</span><div class="value">${escapeHtml(desiredRole)}</div></div>
            <div class="meta"><span class="label">Preferred Location</span><div class="value">${escapeHtml(preferredLocation)}</div></div>
            <div class="meta"><span class="label">Earliest Start Date</span><div class="value">${escapeHtml(startDate)}</div></div>
            <div class="meta"><span class="label">Work Authorization</span><div class="value">${escapeHtml(authorization)}</div></div>
          </div>
          <div class="cta-row">
            <a class="btn btn-primary" href="mailto:${escapeHtml(email)}">Start Conversation</a>
            <a class="btn btn-secondary" href="#contact">View Contact Details</a>
          </div>
        `;

        quickView.innerHTML = [
          [`Total Experience`, `${escapeHtml(years)} Years`],
          [`Primary Stack`, `${escapeHtml(joinList(skills.frameworks_libraries || []))}`],
          [`Location`, `${escapeHtml(preferredLocation)}`],
          [`References`, `${escapeHtml(references)}`],
        ].map(([label, value]) => `<div class="signal"><span>${label}</span><span>${value}</span></div>`).join('');

        contentState.innerHTML = `
          <section id="skills">
            <div class="section-head">
              <div>
                <h2>Technical Strength</h2>
                <p>${escapeHtml(skills.code_quality_practices || 'Built to reduce friction: modern frontend, reliable backend, and deployment-aware development habits.')}</p>
              </div>
            </div>
            <div class="grid-3">
              <div class="card">
                <h3>Languages</h3>
                <div class="chips">${renderChips(skills.programming_languages)}</div>
              </div>
              <div class="card">
                <h3>Frameworks & Libraries</h3>
                <div class="chips">${renderChips(skills.frameworks_libraries)}</div>
              </div>
              <div class="card">
                <h3>Delivery & Quality</h3>
                <div class="chips">${renderChips([...(skills.ci_cd_experience || []), ...(skills.testing_methodologies_experience || [])])}</div>
              </div>
            </div>
          </section>

          <section>
            <div class="grid-3">
              <div class="card stat">
                <strong>${escapeHtml(skills.data_structures_algorithms_proficiency || 'Strong')}</strong>
                <p>${escapeHtml(skills.data_structures_algorithms_proficiency || '')}</p>
              </div>
              <div class="card stat">
                <strong>Secure By Design</strong>
                <p>${escapeHtml(skills.security_best_practices_knowledge || '')}</p>
              </div>
              <div class="card stat">
                <strong>UI/UX Focus</strong>
                <p>${escapeHtml(skills.other_technical_details || '')}</p>
              </div>
            </div>
          </section>

          <section id="experience">
            <div class="section-head">
              <div>
                <h2>Experience</h2>
                <p>${escapeHtml(experience.leadership_mentorship_experience || 'Strong enough to ship, structured enough to scale, and thoughtful enough to keep the experience polished.')}</p>
              </div>
            </div>
            <div class="timeline">
              ${(experience.relevant_work_experience || []).map(item => `
                <div class="timeline-item">
                  <div class="timeline-top">
                    <strong>${escapeHtml(item.company_name || 'Company')} — ${escapeHtml(item.title || '')}</strong>
                    <span>${escapeHtml(item.start_date || '')} → ${escapeHtml(item.end_date || '')}</span>
                  </div>
                  <p>${escapeHtml(item.responsibilities_achievements || '')}</p>
                  <div class="tag-row">${renderTags([...(item.technologies_used || []), item.industry].filter(Boolean))}</div>
                </div>
              `).join('') || `<div class="timeline-item"><p>No work history provided.</p></div>`}
            </div>
          </section>

          <section id="projects">
            <div class="section-head">
              <div>
                <h2>Projects & Proof</h2>
                <p>Work that shows architecture thinking, system flow, and a bias toward completion.</p>
              </div>
            </div>
            <div class="grid-2">
              ${(experience.personal_projects_open_source_contributions || []).map(project => `
                <div class="card">
                  <h3>${escapeHtml(project.project_name || 'Project')}</h3>
                  <p>${escapeHtml(project.description || '')}</p>
                  <p style="margin-top:10px; color:var(--soft);">${escapeHtml(project.your_role_impact || '')}</p>
                  <div class="tag-row">${renderTags([project.url && project.url !== '[Link if available]' ? project.url : null].filter(Boolean))}</div>
                </div>
              `).join('') || `<div class="card"><p>No projects provided.</p></div>`}
            </div>
          </section>

          <section>
            <div class="grid-2">
              <div class="card">
                <h3>Problem Solving</h3>
                <p>${escapeHtml(problem.problem_solving_approach_example || '')}</p>
              </div>
              <div class="card">
                <h3>Critical Thinking</h3>
                <p>${escapeHtml(problem.critical_thinking_example || '')}</p>
              </div>
            </div>
          </section>

          <section>
            <div class="grid-2">
              <div class="card">
                <h3>Communication & Teamwork</h3>
                <p>${escapeHtml(soft.communication_style || '')} ${escapeHtml(soft.teamwork_collaboration_example || '')}</p>
              </div>
              <div class="card">
                <h3>Adaptability</h3>
                <p>${escapeHtml(problem.adaptability_example || '')}</p>
              </div>
            </div>
          </section>

          <section id="contact">
            <div class="footer-cta">
              <h2>${escapeHtml(fullName)} is ready for the next build.</h2>
              <p>
                ${escapeHtml(email)} · ${escapeHtml(phone)} ·
                <span class="muted">LinkedIn:</span> ${escapeHtml(linkedin)} ·
                <span class="muted">GitHub:</span> ${escapeHtml(github)} ·
                <span class="muted">Portfolio:</span> ${escapeHtml(portfolio)}
              </p>
              <div class="cta-row" style="justify-content:center;">
                <a class="btn btn-primary" href="mailto:${escapeHtml(email)}">Email Me</a>
                <a class="btn btn-secondary" href="tel:${escapeHtml(phone)}">Call Me</a>
              </div>
              <p class="small" style="margin-top:14px;">References available upon request · Desired salary range: ${escapeHtml(salary)}</p>
            </div>
          </section>
        `;
      } catch (err) {
        heroState.innerHTML = `
          <div class="error">
            <strong>Could not load developer profile.</strong><br/>
            Expected JSON at: <code>${escapeHtml(dataUrl)}</code><br/>
            ${escapeHtml(err.message)}
          </div>
        `;
        contentState.innerHTML = '';
        quickView.innerHTML = '';
      }
    }

    loadProfile();
  </script></body>
</html>
