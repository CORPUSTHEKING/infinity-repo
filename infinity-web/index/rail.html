<div id="quickrail-outer" style="position: sticky; top: 0; left: 0; width: 100%; z-index: 10000; pointer-events: none;">
    <div style="display: flex; align-items: center; justify-content: space-between; background: rgba(26, 26, 26, 0.95); backdrop-filter: blur(4px); color: #eee; padding: 0 15px; font-family: monospace; border-bottom: 1px solid #333; font-size: 12px; gap: 15px; height: 35px; box-sizing: border-box; pointer-events: auto;">

        <div style="display: flex; align-items: center; gap: 8px; background: #252525; padding: 4px 10px; border-radius: 4px; border: 1px solid #444;">
            <span style="color: #4af; font-weight: bold;">NODE:</span>
            <span>py-server</span>
            <div style="width: 8px; height: 8px; background: #0f0; border-radius: 50%; box-shadow: 0 0 5px #0f0;"></div>
        </div>

        <div style="display: flex; gap: 12px; flex-grow: 1; overflow-x: auto; white-space: nowrap; align-items: center; scrollbar-width: none;">
            <div style="border-left: 2px solid #444; padding-left: 10px;">
                <span style="color: #888;">PORT:</span> <b style="color: #fff;">8080</b>
            </div>
            <div style="border-left: 2px solid #444; padding-left: 10px;">
                <span style="color: #888;">PATH:</span> <b style="color: #fff;">/infinity-web</b>
            </div>
            <div style="border-left: 2px solid #444; padding-left: 10px;">
                <span style="color: #888;">ENV:</span> <span style="color: #f70; font-weight: bold;">TERMUX</span>
            </div>
        </div>

        <div style="display: flex; gap: 6px;">
            <button onclick="location.reload()" style="background: #333; border: 1px solid #555; color: white; padding: 2px 10px; cursor: pointer; border-radius: 3px; font-size: 11px; transition: 0.2s;" onmouseover="this.style.borderColor='#4af'" onmouseout="this.style.borderColor='#555'">RELOAD</button>
            <button style="background: #442222; border: 1px solid #744; color: #f88; padding: 2px 10px; border-radius: 3px; font-size: 11px; cursor: pointer;">STOP</button>
        </div>

    </div>
</div>
